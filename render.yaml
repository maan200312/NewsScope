services:
    - type: web
    name: newsscape-web
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: newsscape-db
          property: connectionString
            - key: REDIS_URL
        fromService:
          type: redis
          name: newsscape-redis
          property: connectionString

    - type: worker
    name: newsscape-celery-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: newsscape-db
          property: connectionString
            - key: REDIS_URL
        fromService:
          type: redis
          name: newsscape-redis
          property: connectionString

    - type: cron
    name: newsscape-pipeline
    env: python
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py fetch_news && python manage.py shell -c "from news.services.embeddings import generate_embeddings; generate_embeddings()" && python manage.py shell -c "from news.services.clustering import save_clusters; save_clusters()"

databases:
    - name: newsscape-db
    plan: free

    - name: newsscape-redis
    type: redis
    plan: free
    maxmemoryPolicy: allkeys-lru
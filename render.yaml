services:
    - type: web
    name: newsscape-web
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: newsscape-db
          property: connectionString
            - key: REDIS_URL
        fromService:
          type: redis
          name: newsscape-redis
          property: connectionString

    - type: worker
    name: newsscape-celery-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: newsscape-db
          property: connectionString
            - key: REDIS_URL
        fromService:
          type: redis
          name: newsscape-redis
          property: connectionString

databases:
    - name: newsscape-db
    plan: free
    - name: newsscape-redis
    plan: free
    databaseName: redis
    ipAllowList: []
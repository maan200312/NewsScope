services:
    - type: web
    name: NewsScope
    env: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn NewsScope.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
            - key: PYTHON_VERSION
        value: 3.11.9
